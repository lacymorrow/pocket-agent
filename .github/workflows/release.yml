name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - name: Package VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ./cursor-pocket-agent*.vsix
      - name: Publish to VS Code Marketplace
        if: env.VSCE_TOKEN != ''
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: npx vsce publish -p $VSCE_TOKEN --packagePath $(ls cursor-pocket-agent*.vsix)